// ============================================================
//  Source2Boost — autoexec.cfg (шаблон)
//  Генерируется под железо. Только ВАЛИДНЫЕ для CS2 команды.
//  Плейсхолдеры вида {{NAME}} подставляет модуль Cs2.
//  Путь назначения: ...\game\csgo\cfg\autoexec.cfg
//  Активация: launch option  +exec autoexec
// ============================================================

// ---- FPS / фреймтайм ----
fps_max {{FPS_MAX}}            // 0 = без лимита (приоритет: макс FPS). Для стабильности можно 400.
fps_max_ui 180                // кап меню, чтобы не грелось впустую
engine_no_focus_sleep 0       // не резать FPS при потере фокуса (ровнее фреймтайм)

// ---- Сеть (CS2 sub-tick: минимум легенд, только рабочее) ----
rate {{RATE}}                 // пропускная способность; 786432 для быстрого интернета
cl_forcepreload 1             // предзагрузка моделей/карты -> меньше микро-фризов в матче

// ---- Разгрузка рендера (мелочи, дающие ровность на слабом CPU) ----
cl_disable_ragdolls 1         // без рэгдоллов трупов -> меньше нагрузка
r_drawtracers_firstperson 0   // убрать трассеры от первого лица
muzzleflash_light 0           // без динамического света от вспышки

// ---- Аудио (стабильность, без влияния на честность) ----
snd_mixahead 0.025            // меньше задержка звука
snd_pushtotalk_looptime 0.0

// ---- HUD / мелочи ----
cl_showfps 0                  // (мониторинг делаем через PresentMon, не через игру)

// ---- Применить и залочить ----
host_writeconfig
echo "[Source2Boost] autoexec loaded"
